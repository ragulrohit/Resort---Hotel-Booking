<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviews & Feedback — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="dashboard" data-page="dashboard" data-charts="reviews">

  <div class="dash-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="dash-main">
      <header class="dash-header" id="dash-header"></header>

      <div class="panel-grid">
        <!-- WRITE REVIEW -->
        <form class="panel" id="review-form" novalidate>
          <h3><i class="fa-solid fa-pen-to-square" style="color:var(--color-secondary)"></i> Write a Review</h3>
          <div class="form-group">
            <label class="label" for="hotel">Hotel</label>
            <select class="select" id="hotel" name="hotel">
              <option value="">Select a hotel</option>
            </select>
          </div>
          <div class="form-group">
            <label class="label">Your Rating</label>
            <div style="display:flex;gap:6px;font-size:1.8rem" class="star-wrap">
              <span class="star active" data-value="1" role="button" tabindex="0" aria-label="1 star">★</span>
              <span class="star active" data-value="2" role="button" tabindex="0" aria-label="2 stars">★</span>
              <span class="star active" data-value="3" role="button" tabindex="0" aria-label="3 stars">★</span>
              <span class="star active" data-value="4" role="button" tabindex="0" aria-label="4 stars">★</span>
              <span class="star active" data-value="5" role="button" tabindex="0" aria-label="5 stars">★</span>
            </div>
            <input type="hidden" id="rating" name="rating" value="5">
          </div>
          <div class="form-group">
            <label class="label" for="name">Your Name</label>
            <input type="text" class="input" id="name" name="name" placeholder="Full name">
          </div>
          <div class="form-group">
            <label class="label" for="email">Email</label>
            <input type="email" class="input" id="email" name="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label class="label" for="comment">Your Review</label>
            <textarea class="textarea" id="comment" name="comment" rows="4" placeholder="Share your experience…"></textarea>
          </div>
          <button class="btn btn-primary" type="submit"><i class="fa-solid fa-paper-plane"></i> Submit Review</button>
        </form>

        <!-- STATS -->
        <div class="panel">
          <h3><i class="fa-solid fa-chart-bar" style="color:var(--color-secondary)"></i> Rating Distribution</h3>
          <div class="chart-wrap"><canvas id="chartReviews" aria-label="Review rating distribution bar chart" role="img"></canvas></div>
        </div>
      </div>

      <div class="panel">
        <h3><i class="fa-solid fa-comments" style="color:var(--color-secondary)"></i> Recent Reviews</h3>
        <div id="reviews-list" style="display:flex;flex-direction:column;gap:1rem"></div>
      </div>
    </div>
  </div>

  <!-- LOGOUT MODAL -->
  <div class="modal" id="logout-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-sm">
      <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
      <h3 class="modal-title">Are you sure you want to log out?</h3>
      <p class="modal-text muted">You will need to log in again to access your dashboard.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" data-close-modal="logout-modal">Cancel</button>
        <button class="btn btn-danger" id="logout-confirm">Confirm Logout</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/dashboard.js?v=20261016logo"></script>
</body>
</html>
