<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Destinations — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="dashboard" data-page="dashboard">

  <div class="dash-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="dash-main">
      <header class="dash-header" id="dash-header"></header>

      <!-- mini hero -->
      <div style="position:relative;border-radius:var(--radius-lg);overflow:hidden;min-height:220px;display:flex;align-items:center;color:#fff;background:url('../../images/unsplash-1476514525535-07fb3b4ae5f1-1600.webp') center/cover no-repeat;isolation:isolate">
        <div style="position:absolute;inset:0;background:linear-gradient(90deg, rgba(10,31,63,.85), rgba(10,31,63,.35));z-index:-1"></div>
        <div style="padding:clamp(1.2rem,3vw,2.2rem);display:flex;flex-direction:column;gap:.8rem;max-width:560px">
          <span class="badge" style="background:rgba(255,255,255,.18);color:#fff;width:fit-content"><i class="fa-solid fa-map-location-dot"></i> Wanderlust Awaits</span>
          <h2 style="color:#fff">Explore Dream Destinations</h2>
          <p style="color:rgba(255,255,255,.9)">Browse curated destinations, filter by budget and region, then jump straight into the best hotels.</p>
        </div>
      </div>

      <!-- FILTERS -->
      <div class="panel">
        <div class="filter-bar">
          <div class="form-group">
            <label class="label" for="dash-dest-search"><i class="fa-solid fa-magnifying-glass"></i> Search</label>
            <input type="search" class="input" id="dash-dest-search" placeholder="Search destinations…">
          </div>
          <div class="form-group">
            <label class="label" for="dash-region-filter">Region</label>
            <select class="select" id="dash-region-filter">
              <option value="all">All Regions</option>
              <option value="asia">Asia</option>
              <option value="europe">Europe</option>
              <option value="middle-east">Middle East</option>
              <option value="oceania">Oceania</option>
            </select>
          </div>
          <div class="form-group">
            <label class="label" for="dash-budget-filter">Budget</label>
            <select class="select" id="dash-budget-filter">
              <option value="all">All Budgets</option>
              <option value="budget">Budget-Friendly</option>
              <option value="mid">Mid-Range</option>
              <option value="luxury">Luxury</option>
            </select>
          </div>
        </div>
      </div>

      <!-- GRID -->
      <div class="grid cards-3 stagger" id="explore-dest-grid"></div>
    </div>
  </div>

  <!-- LOGOUT MODAL -->
  <div class="modal" id="logout-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-sm">
      <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
      <h3 class="modal-title">Are you sure you want to log out?</h3>
      <p class="modal-text muted">You will need to log in again to access your dashboard.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" data-close-modal="logout-modal">Cancel</button>
        <button class="btn btn-danger" id="logout-confirm">Confirm Logout</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/dashboard.js?v=20261016logo"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const search = document.getElementById('dash-dest-search');
      const region = document.getElementById('dash-region-filter');
      const budget = document.getElementById('dash-budget-filter');
      function apply() {
        const term = search.value.toLowerCase();
        const r = region.value, b = budget.value;
        document.querySelectorAll('#explore-dest-grid .dest-card').forEach(card => {
          const title = card.querySelector('.dest-title')?.textContent.toLowerCase() || '';
          let show = true;
          if (term && !title.includes(term)) show = false;
          if (r !== 'all' && card.dataset.region !== r) show = false;
          if (b !== 'all' && card.dataset.budget !== b) show = false;
          card.style.display = show ? '' : 'none';
        });
      }
      [search, region, budget].forEach(el => { el.addEventListener('input', apply); el.addEventListener('change', apply); });
      // reveal
      const io = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); io.unobserve(e.target); } });
      }, { threshold: 0.12 });
      document.querySelectorAll('.reveal, .stagger').forEach(el => io.observe(el));
    });
  </script>
</body>
</html>
