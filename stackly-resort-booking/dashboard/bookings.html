<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — Stackly</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/animations.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="dashboard" data-page="dashboard">

  <div class="dash-shell">
    <aside class="sidebar" id="sidebar"></aside>

    <div class="dash-main">
      <header class="dash-header" id="dash-header"></header>

      <!-- FILTERS -->
      <div class="panel">
        <div class="filter-bar">
          <div class="form-group">
            <label class="label" for="booking-search"><i class="fa-solid fa-magnifying-glass"></i> Search</label>
            <input type="search" class="input" id="booking-search" placeholder="Search by ref, hotel or destination…">
          </div>
          <div class="form-group">
            <label class="label" for="booking-filter">Status</label>
            <select class="select" id="booking-filter">
              <option value="all">All Statuses</option>
              <option value="upcoming">Upcoming</option>
              <option value="completed">Completed</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </div>
          <div class="form-group" style="justify-content:flex-end">
            <a href="reservations.html" class="btn btn-primary" style="height:50px"><i class="fa-solid fa-plus"></i> New Booking</a>
          </div>
        </div>
      </div>

      <!-- TABLE -->
      <div class="panel">
        <h3><i class="fa-solid fa-calendar-check" style="color:var(--color-secondary)"></i> Booking History</h3>
        <div class="table-wrap">
          <table class="data-table">
            <thead>
              <tr>
                <th scope="col">Reference</th><th scope="col">Hotel</th><th scope="col">Destination</th><th scope="col">Dates</th>
                <th scope="col">Guests / Rooms</th><th scope="col">Price</th><th scope="col">Status</th><th scope="col">Actions</th>
              </tr>
            </thead>
            <tbody id="bookings-table"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- BOOKING DETAIL MODAL -->
  <div class="modal" id="booking-detail-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box">
      <button class="icon-btn" data-close-modal="booking-detail-modal" aria-label="Close" style="align-self:flex-end"><i class="fa-solid fa-xmark"></i></button>
      <img class="bd-img" src="" alt="" style="width:100%;height:200px;object-fit:cover;border-radius:14px">
      <h2 class="bd-hotel"></h2>
      <p class="muted">Reference: <strong class="bd-ref"></strong> • <span class="bd-status"></span></p>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:.8rem">
        <div><p class="muted">Destination</p><strong class="bd-dest"></strong></div>
        <div><p class="muted">Dates</p><strong class="bd-dates"></strong></div>
        <div><p class="muted">Guests / Rooms</p><strong class="bd-guests"></strong></div>
        <div><p class="muted">Room Type</p><strong class="bd-room"></strong></div>
        <div><p class="muted">Total</p><strong class="bd-total" style="color:var(--color-secondary);font-size:1.2rem"></strong></div>
      </div>
      <div class="modal-actions" style="justify-content:flex-end">
        <button class="btn btn-outline" data-close-modal="booking-detail-modal">Close</button>
      </div>
    </div>
  </div>

  <!-- LOGOUT MODAL -->
  <div class="modal" id="logout-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <div class="modal-box modal-sm">
      <div class="modal-icon"><i class="fa-solid fa-right-from-bracket"></i></div>
      <h3 class="modal-title">Are you sure you want to log out?</h3>
      <p class="modal-text muted">You will need to log in again to access your dashboard.</p>
      <div class="modal-actions">
        <button class="btn btn-outline" data-close-modal="logout-modal">Cancel</button>
        <button class="btn btn-danger" id="logout-confirm">Confirm Logout</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="../assets/js/storage.js"></script>
  <script src="../assets/js/validation.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/booking.js"></script>
  <script src="../assets/js/charts.js"></script>
  <script src="../assets/js/dashboard.js?v=20261016logo"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const s = document.getElementById('booking-search');
      const f = document.getElementById('booking-filter');
      [s, f].forEach(el => {
        el.addEventListener('input', () => StacklyDashboard.renderBookings());
        el.addEventListener('change', () => StacklyDashboard.renderBookings());
      });
    });
  </script>
</body>
</html>
